services:
  backend:
    build: ./backend
    container_name: analyses_backend
    env_file:
      - .env
    # ports:
    #   - "8000:8000"
    volumes:
      - ./backend/logs:/app/logs
      - ./backend/data:/data
    networks:
      - default
      - extra_net

  frontend:
    build:
      context: ./frontend
      args:
        # Берётся из корневого .env или по умолчанию /extra/analyses
        # В рантайм frontend это не нужно: префикс уже «зашит» в собранный JS.
        VITE_ROOT_PATH: ${ROOT_PATH:-/extra/analyses}
    container_name: analyses_frontend
    # ports:
    #   - "80:80"
    networks:
      - default
      - extra_net

  nginx:
    profiles: ["devproxy"]
    build: ./nginx
    ports:
      - "8000:80"
    depends_on:
      - backend
      - frontend
    networks:
      - default

networks:
  extra_net:
    external: true
    name: extra_services