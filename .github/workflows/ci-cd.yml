name: CI/CD

on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]
  workflow_dispatch:

concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: CI
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare .env for CI
        run: cp .env.example .env

      - name: Ensure docker network exists
        run: docker network create extra_services || true

      - name: Validate Docker Compose config
        run: docker compose config --quiet

      - name: Build backend image
        run: docker compose build backend

      - name: Run backend tests
        run: docker compose run --rm --no-deps backend pytest

  deploy:
    name: Deploy (SSH -> docker compose)
    runs-on: ubuntu-latest
    needs: [ci]
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script_stop: true
          script: |
            export DEPLOY_PATH='${{ secrets.DEPLOY_PATH }}'
            if [ -z "$DEPLOY_PATH" ]; then export DEPLOY_PATH="/var/www/Diary-project/analyses"; fi
            export DEPLOY_BRANCH='${{ secrets.DEPLOY_BRANCH }}'
            if [ -z "$DEPLOY_BRANCH" ]; then export DEPLOY_BRANCH="master"; fi
            cd "$DEPLOY_PATH"
            git fetch --prune origin
            git reset --hard "origin/${DEPLOY_BRANCH}"
            bash ".github/deploy_ssh.sh"
