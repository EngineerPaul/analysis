server {
    listen 80;
    server_name localhost;

    # Relative Location keeps host:port from the browser (e.g. 127.0.0.1:8000).
    # Absolute redirects would drop :8000 because this block listens on :80.
    absolute_redirect off;

    # Dev: backend/frontend без publish портов — ходим по docker-сети и container_name.
    location /extra/analyses/api/ {
        proxy_pass http://analyses_backend:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /extra/analyses/ {
        proxy_pass http://analyses_frontend:80/extra/analyses/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /extra/analyses {
        return 301 /extra/analyses/;
    }
}
